[project]
name = "pro-os-connect-py"
version = "0.9.5"
authors = [
  { name="Petr Sedlacek", email="piit@zz9.cz" },
]
description = "Library to interface with the Donaldson Bofa Pro OS Connect fume extractor controller"
keywords=["fume extractor", "donaldson bofa", "bofa", "pro os", "pro os connect"]
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
  "crccheck >=1.3.1, <1.4.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.scripts]
pro-os-connect-cli = "pro_os_connect.cli:main"

[project.urls]
Homepage = "https://github.com/piit79/pro-os-connect-py"
Repository = "https://github.com/piit79/pro-os-connect-py"
Issues = "https://github.com/piit79/pro-os-connect-py/issues"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers",
    "--strict-config",
    "-ra",
    "--cov=pro_os_connect",
    "--cov-report=term-missing",
    "--cov-fail-under=99",
]
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
branch = true  # also report if/else branches that never ran

[tool.coverage.report]
exclude_also = ['if __name__ == "__main__":']

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
# Line length is handled by the formatter, which leaves long strings and comments alone
ignore = ["E501"]
