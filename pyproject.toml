[project]
name = "pro-os-connect-py"
version = "0.9.9"
authors = [
  { name="Petr Sedlacek", email="piit@zz9.cz" },
]
description = "Library to interface with the Donaldson Bofa Pro OS Connect fume extractor controller"
keywords=["fume extractor", "donaldson bofa", "bofa", "pro os", "pro os connect"]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
  "crccheck >=1.3.1, <2",
]
classifiers = [
    "Development Status :: 4 - Beta",  # Change to "5 - Production/Stable" for 1.0.0
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    # Keep in sync with requires-python and the CI test matrix
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Home Automation",
    "Topic :: System :: Hardware",
    "Typing :: Typed",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14"]
build-backend = "uv_build"

[project.scripts]
pro-os-connect-cli = "pro_os_connect.cli:main"

[project.urls]
Homepage = "https://github.com/piit79/pro-os-connect-py"
Repository = "https://github.com/piit79/pro-os-connect-py"
Issues = "https://github.com/piit79/pro-os-connect-py/issues"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
]

[tool.uv.build-backend]
module-name = "pro_os_connect"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers",
    "--strict-config",
    "-ra",
    "--cov=pro_os_connect",
    "--cov-report=term-missing",
    "--cov-fail-under=99",
]
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
branch = true  # also report if/else branches that never ran

[tool.coverage.report]
exclude_also = ['if __name__ == "__main__":']

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
# Line length is handled by the formatter, which leaves long strings and comments alone
ignore = ["E501"]
